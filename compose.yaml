services:
  app:
    build:
      context: .
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://sanaei-insurance.ir/api}
    image: parsian-afarin-site:latest
    # Bound to loopback: put nginx/Caddy/Traefik in front of it.
    # Use "3000:3000" only if you want to expose it directly.
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  app-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://sanaei-insurance.ir/api}
      - WATCHPACK_POLLING=true   # reliable file watching on Windows/macOS
    volumes:
      - .:/app
      - /app/node_modules        # keep container's installed deps
      - /app/.next